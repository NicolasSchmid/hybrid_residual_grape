[project]
name = "simplified-adaptive-grape"
version = "0.1.0"
description = "Simplified adaptive GRAPE experiments from binary Fock-state measurements"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ipykernel",
    "jax",
    "jaxlib",
    "matplotlib",
    "numpy",
    "optax",
    "qutip",
    "scipy",
    "tqdm",
    "jax[cuda12]",
    "dynamiqs>=0.3.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["toolbox"]
